version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fhir_postgres_db
    restart: always
    environment:
      POSTGRES_DB: fhir_db
      POSTGRES_USER: fhir_user
      POSTGRES_PASSWORD: fhir_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhir_user -d fhir_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fhir_clinical_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fhir_user:fhir_pass@db:5432/fhir_db
      - HOST=0.0.0.0
      - PORT=8000
      - FHIR_API_BASE_URL=http://localhost:8000

volumes:
  postgres_data:
